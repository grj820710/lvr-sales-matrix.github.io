name: 更新實價登錄資料

on:
  schedule:
    # GitHub Actions 的 cron 一律用 UTC。台北時間週一 13:00 = UTC 週一 05:00。
    # 排程觸發常有數分鐘到數十分鐘的延遲，這是 GitHub 的已知行為，不是設定錯誤。
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      backfill:
        description: "回補歷史季別（首次建立資料時勾選）"
        type: boolean
        default: false
      dump:
        description: "印出來源檔表頭與原始欄位（筆數對不上時勾選）"
        type: boolean
        default: false

# 需要寫入權限才能把產出的頁面 commit 回去
permissions:
  contents: write

concurrency:
  group: update-lvr
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 抓取並產出頁面
        run: |
          ARGS=""
          [ "${{ inputs.backfill }}" = "true" ] && ARGS="$ARGS --backfill"
          [ "${{ inputs.dump }}" = "true" ]     && ARGS="$ARGS --dump"
          python scripts/update.py $ARGS

      - name: 提交變更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs docs/.nojekyll
          # 沒有異動時就跳過，避免產生一堆空 commit
          if git diff --staged --quiet; then
            echo "資料無變化，不建立 commit"
          else
            git commit -m "自動更新實價登錄資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
